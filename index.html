<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#c9d9d5">
<title>乡间小杂货铺 · V7.5 前置招牌</title>
<style>
:root{--cream:#fff5df;--ink:#654a35;--brown:#a9784f;--pink:#e99583;--green:#9dbb83;--blue:#91bdc8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c9d9d5;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 13px;border:3px solid #d2ae7f;border-radius:22px;background:rgba(255,247,226,.94);box-shadow:0 5px 0 #a77c54;z-index:3}
.brand{font-weight:900;font-size:17px;line-height:1.1}.sub{font-size:9px;letter-spacing:2px;color:#9a8065;margin-top:4px}
.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.pill{border:2px solid #dfc49b;border-radius:99px;background:#fff0d2;padding:6px 9px;font-weight:800;font-size:12px;white-space:nowrap}
.panel{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;padding:11px;border:3px solid #d2ae7f;border-radius:23px;background:rgba(255,247,226,.96);box-shadow:0 5px 0 #a77c54}
.status{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;margin:0 3px 9px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
button{border:2px solid #c99f70;border-radius:15px;padding:10px 4px;background:#f5dfb7;color:#654a35;font-weight:900;font-size:12px;box-shadow:0 3px 0 #b98b60;min-height:46px;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #b98b60}
button.pink{background:#eca18e}button.green{background:#b1c796}button.blue{background:#a8cbd0}button:disabled{opacity:.5}
.hint{font-size:10px;text-align:center;margin-top:8px;color:#92775b}
.toast{position:absolute;top:100px;left:50%;transform:translateX(-50%);z-index:4;background:#fff5df;border:2px solid #c99f70;border-radius:30px;padding:8px 14px;font-size:12px;font-weight:800;box-shadow:0 3px 0 #b98b60;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
@media(min-width:760px){.topbar{left:24px;right:24px;top:18px;padding:14px 20px}.brand{font-size:22px}.pill{font-size:14px;padding:8px 13px}.panel{left:24px;right:24px;bottom:18px;padding:14px 18px}.actions{grid-template-columns:repeat(4,minmax(120px,1fr));max-width:760px;margin:auto}button{font-size:14px;min-height:52px}.hint{font-size:12px}}
</style>
</head>
<body>
<div id="game"></div>
<div class="topbar"><div><div class="brand">🏡 小镇杂货铺</div><div class="sub">MY LITTLE GROCERY · 3D WORLD</div></div>
<div class="stats"><span class="pill" id="money">🪙 RM 500.00</span><span class="pill" id="hearts">❤️ 0</span><span class="pill" id="day">📅 第 1 天</span></div></div>
<div class="toast" id="toast"></div>
<div class="panel"><div class="status"><span id="state">🌷 营业中 · 欢迎来到小店</span><span id="customers">顾客 0 位</span></div>
<div class="actions">
<button class="pink" id="checkout">🧾 收银结账</button><button class="green" id="restock">📦 快速补货</button><button class="blue" id="call">💬 招呼顾客</button><button id="clean">🧹 打扫卫生</button>
</div><div class="hint">拖动屏幕旋转视角 · 双指/滚轮缩放 · 点击商品可查看</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.querySelector('#game');
document.querySelector('.topbar')?.remove();
document.querySelector('.panel')?.remove();
document.querySelector('.toast')?.remove();

const scene=new THREE.Scene();
scene.background=new THREE.Color('#c9d9d5');
scene.fog=new THREE.Fog('#c9d9d5',34,66);

const camera=new THREE.PerspectiveCamera(innerWidth<700?48:42,innerWidth/innerHeight,.1,100);
camera.position.set(18,13,25);
camera.lookAt(0,2.0,-.2);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffead5,0x78634f,2.35));
const sun=new THREE.DirectionalLight(0xfff1dc,3.0);
sun.position.set(-7,14,9); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-14; sun.shadow.camera.right=14;
sun.shadow.camera.top=14; sun.shadow.camera.bottom=-14;
scene.add(sun);

const fill=new THREE.DirectionalLight(0xd7e9f1,.85);
fill.position.set(9,7,-5); scene.add(fill);

function woodTexture(base,grain,seed=1){
  const c=document.createElement('canvas'); c.width=512;c.height=256;
  const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,512,256);
  let n=seed*9301+49297;
  const rand=()=>{n=(n*9301+49297)%233280;return n/233280};
  for(let i=0;i<95;i++){
    const y=rand()*256, x=rand()*512, w=25+rand()*300;
    g.strokeStyle=grain;g.globalAlpha=.07+rand()*.12;g.lineWidth=.5+rand()*2;
    g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+w*.3,y-3,x+w*.6,y+3,x+w,y+(rand()-.5)*4);g.stroke();
  }
  for(let i=0;i<10;i++){
    const x=rand()*512,y=rand()*256;
    g.strokeStyle=grain;g.globalAlpha=.13;g.lineWidth=1;
    g.beginPath();g.ellipse(x,y,8+rand()*14,2+rand()*4,0,0,Math.PI*2);g.stroke();
  }
  g.globalAlpha=1;
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;
}
const plankTex=woodTexture('#a8754f','#f1c99a',4);
const wallTex=woodTexture('#b9855d','#f4d2a6',8);
const beamTex=woodTexture('#765039','#d9aa7d',12);
function woodMat(tex,repeatX=1,repeatY=1,rough=.78){
  tex=tex.clone();tex.needsUpdate=true;tex.repeat.set(repeatX,repeatY);
  return new THREE.MeshStandardMaterial({map:tex,roughness:rough});
}
const floorMat=woodMat(plankTex,1.3,1.0,.72);
const wallMat=woodMat(wallTex,1.5,1,.82);
const beamMat=woodMat(beamTex,1,1,.8);
const trimMat=new THREE.MeshStandardMaterial({color:'#69452f',roughness:.8});
const edgeMat=new THREE.MeshStandardMaterial({color:'#d0a078',roughness:.75});

function addBox(w,h,d,material,x,y,z,receive=true){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=receive;
  scene.add(mesh);return mesh;
}

// Spacious rectangular shop shell; open front for a clear playable view.
const W=22,D=18,H=7.2;
addBox(W,.42,D,floorMat,0,-.22,0);

// Individual floorboards with fine seams and slightly varied wood tones.
const floorBoards=['#b9855d','#c18c63','#ae7954','#c3926b','#b17c56'];
for(let i=0;i<30;i++){
  const x=-10.64+i*.727;
  const m=new THREE.MeshStandardMaterial({map:plankTex,roughness:.76,color:floorBoards[i%floorBoards.length]});
  const board=addBox(.705,.055,17.72,m,x,.015,0);
  board.position.y=.015;
}
for(let z=-8.7;z<=8.7;z+=1.45){
  addBox(21.9,.018,.025,trimMat,0,.047,z);
}

// Back wall, built from separate wide horizontal timber boards.
for(let j=0;j<13;j++){
  const y=.35+j*.55;
  addBox(W,.535,.28,wallMat,0,y,-8.86);
  addBox(W,.025,.035,trimMat,0,y-.27,-8.69);
}
// Side walls made from planks running along the depth.
for(const side of [-1,1]){
  for(let j=0;j<13;j++){
    const y=.35+j*.55;
    addBox(.28,.535,D,wallMat,side*11.0,y,0);
    addBox(.035,.025,D,trimMat,side*10.83,y-.27,0);
  }
}
// Exposed timber corner posts and wall framing.
for(const x of [-10.82,0,10.82]){
  addBox(.22,H,.34,beamMat,x,H/2-0.05,-8.68);
}
for(const z of [-8.5,0,8.5]){
  for(const x of [-10.82,10.82]) addBox(.34,H,.22,beamMat,x,H/2-0.05,z);
}
// Baseboards and top rails.
for(const zSide of [-1,1]){
  addBox(.34,.28,D,beamMat,zSide*10.82,.17,0);
  addBox(.34,.24,D,beamMat,zSide*10.82,6.95,0);
}
addBox(W,.28,.34,beamMat,0,.17,-8.62);
addBox(W,.24,.34,beamMat,0,6.95,-8.62);

// Roof structure: open rafters and cross beams, leaving the room airy.
for(let z=-8.2;z<=8.2;z+=3.0){
  addBox(22,.22,.28,beamMat,0,7.18,z);
}
for(const x of [-10,-6,-2,2,6,10]){
  addBox(.2,.22,17.2,beamMat,x,7.18,0);
}
// A simple timber lintel across the open storefront.
addBox(22,.28,.32,beamMat,0,7.18,8.65);

// Ceiling-mounted track lighting: three long rows with warm spot heads.
const trackMat=new THREE.MeshStandardMaterial({color:'#292724',metalness:.72,roughness:.34});
const lampHousingMat=new THREE.MeshStandardMaterial({color:'#34302a',metalness:.55,roughness:.38});
const bulbMat=new THREE.MeshStandardMaterial({
  color:'#fff0c9',emissive:'#ffbf63',emissiveIntensity:2.4,roughness:.28
});
for(const x of [-7.2,0,7.2]){
  // Slim black track fixed directly under the timber ceiling.
  addBox(.075,.075,16.6,trackMat,x,6.88,0,false);
  for(const z of [-7,-3.5,0,3.5,7]){
    // Short stem and compact adjustable spotlight housing.
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.22,12),trackMat);
    stem.position.set(x,6.72,z);scene.add(stem);
    const housing=new THREE.Mesh(new THREE.CylinderGeometry(.17,.25,.34,20),lampHousingMat);
    housing.position.set(x,6.48,z);housing.rotation.x=Math.PI;scene.add(housing);
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(.125,16,12),bulbMat);
    bulb.position.set(x,6.29,z);scene.add(bulb);
    // Soft warm beam aimed straight down to brighten the shop floor.
    const spot=new THREE.SpotLight(0xffd49a,42,15,Math.PI/4.2,.55,1.25);
    spot.position.set(x,6.25,z);
    spot.target.position.set(x,0.2,z);
    scene.add(spot,spot.target);
  }
}
// Extra warm bounce light keeps the whole empty room evenly readable.
const warmFill=new THREE.PointLight(0xffd09a,34,30,1.7);
warmFill.position.set(0,5.9,-1.5);scene.add(warmFill);

// Compact modern checkout counter — placed at the FRONT-LEFT entrance wall.
// Its long side runs along the left wall so the central shop aisle stays open.
const counterBodyMat=new THREE.MeshStandardMaterial({color:'#98613d',roughness:.72});
const counterSlatMat=new THREE.MeshStandardMaterial({color:'#bd8657',roughness:.66});
const counterTopMat=new THREE.MeshStandardMaterial({color:'#eee5d5',roughness:.3});
const counterDarkMat=new THREE.MeshStandardMaterial({color:'#24282b',metalness:.35,roughness:.32});
const ledMat=new THREE.MeshStandardMaterial({color:'#ffe2a7',emissive:'#ffbd62',emissiveIntensity:2.1});
const screenMat=new THREE.MeshStandardMaterial({color:'#101820',roughness:.2,metalness:.18});
const plantLeafMat=new THREE.MeshStandardMaterial({color:'#477b50',roughness:.78,side:THREE.DoubleSide});
const potMat=new THREE.MeshStandardMaterial({color:'#d7c7ad',roughness:.8});

// Shop front is at +Z; left wall is at -X.
// Counter length is 4.45 units, roughly half the previous long counter.
const ccx=-10.02, ccz=5.05, cLen=4.45, cDepth=1.22;
const cFrontX=ccx+cDepth/2+.045;

// Main cabinet and recessed toe-kick.
addBox(cDepth,1.08,cLen,counterBodyMat,ccx,.61,ccz);
addBox(cDepth+.08,.13,cLen+.08,trimMat,ccx,.065,ccz);

// Narrow vertical timber slats on the customer-facing side (+X).
for(let i=0;i<31;i++){
  const z=ccz-cLen/2+.10+i*.14;
  addBox(.075,.88,.075,counterSlatMat,cFrontX,.61,z);
}

// End panels and a clean, slightly overhanging cream countertop.
addBox(cDepth+.08,1.0,.16,counterBodyMat,ccx,.58,ccz-cLen/2+.04);
addBox(cDepth+.08,1.0,.16,counterBodyMat,ccx,.58,ccz+cLen/2-.04);
addBox(cDepth+.18,.16,cLen+.20,counterTopMat,ccx,1.20,ccz);

// Warm concealed LED line along the customer-facing front and lower plinth.
addBox(.035,.035,cLen-.16,ledMat,cFrontX+.045,1.085,ccz);
addBox(.045,.035,cLen-.22,ledMat,cFrontX+.05,.17,ccz);

// Small open wooden bagging cubby at the entrance end of the counter.
const cubbyZ=ccz+cLen/2-.42;
addBox(.58,.10,.78,counterSlatMat,ccx-.02,1.34,cubbyZ);
addBox(.58,.42,.07,counterBodyMat,ccx-.02,1.12,cubbyZ+.36);
addBox(.58,.42,.07,counterBodyMat,ccx-.02,1.12,cubbyZ-.36);
addBox(.07,.42,.78,counterBodyMat,ccx-.30,1.12,cubbyZ);
addBox(.07,.42,.78,counterBodyMat,ccx+.26,1.12,cubbyZ);

// POS monitor mounted on the counter, screen facing into the shop (+X).
const monitor=new THREE.Mesh(new THREE.BoxGeometry(.075,.48,.68),counterDarkMat);
monitor.position.set(ccx+.28,1.58,ccz-.35);scene.add(monitor);
const monitorGlass=new THREE.Mesh(new THREE.BoxGeometry(.012,.39,.59),screenMat);
monitorGlass.position.set(ccx+.325,1.59,ccz-.35);scene.add(monitorGlass);
addBox(.24,.045,.28,counterDarkMat,ccx+.27,1.31,ccz-.35);

// Compact card terminal beside the monitor.
addBox(.28,.10,.22,counterDarkMat,ccx+.43,1.34,ccz-.98);
const terminalScreen=new THREE.Mesh(new THREE.BoxGeometry(.012,.018,.14),screenMat);
terminalScreen.position.set(ccx+.575,1.40,ccz-.98);scene.add(terminalScreen);

// Small potted trailing plant at the far end; kept within the counter footprint.
const plantX=ccx-.03, plantZ=ccz-cLen/2+.43;
const pot=new THREE.Mesh(new THREE.CylinderGeometry(.17,.14,.24,18),potMat);
pot.position.set(plantX,1.39,plantZ);scene.add(pot);
const soil=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.02,16),
  new THREE.MeshStandardMaterial({color:'#59432e'}));
soil.position.set(plantX,1.52,plantZ);scene.add(soil);
for(let i=0;i<8;i++){
  const a=i*Math.PI*2/8;
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(.095,12,10),plantLeafMat);
  leaf.scale.set(.55,1.8,.48);
  leaf.position.set(plantX+Math.cos(a)*.15,1.68+(i%3)*.055,plantZ+Math.sin(a)*.15);
  leaf.rotation.z=Math.cos(a)*.5;leaf.rotation.x=Math.sin(a)*.32;scene.add(leaf);
}
for(let i=0;i<3;i++){
  const leaf=new THREE.Mesh(new THREE.CapsuleGeometry(.028,.34,4,8),plantLeafMat);
  leaf.position.set(plantX+.12+i*.055,1.48-i*.08,plantZ-.12-i*.035);
  leaf.rotation.z=-.55-i*.1;leaf.rotation.x=.2;scene.add(leaf);
}

// Five upright refrigerated display units on the wall opposite the checkout.
// Three beverage coolers + two upright freezers; all interiors start empty.
const coolerBodyMat=new THREE.MeshStandardMaterial({color:'#d9e0e2',metalness:.42,roughness:.3});
const coolerSideMat=new THREE.MeshStandardMaterial({color:'#b9c5ca',metalness:.35,roughness:.38});
const freezerBodyMat=new THREE.MeshStandardMaterial({color:'#cbd8e3',metalness:.38,roughness:.3});
const coolerDarkMat=new THREE.MeshStandardMaterial({color:'#29343a',metalness:.55,roughness:.32});
const innerMat=new THREE.MeshStandardMaterial({color:'#e8f3f6',roughness:.35,metalness:.08});
const shelfMat=new THREE.MeshStandardMaterial({color:'#c9d7dc',metalness:.42,roughness:.3});
const glassMat=new THREE.MeshPhysicalMaterial({
  color:'#d9f3ff',transparent:true,opacity:.24,roughness:.08,metalness:.12,
  clearcoat:1,clearcoatRoughness:.05,depthWrite:false,side:THREE.DoubleSide
});
const glassEdgeMat=new THREE.MeshStandardMaterial({color:'#e8f7ff',metalness:.62,roughness:.2});
const handleMat=new THREE.MeshStandardMaterial({color:'#66767d',metalness:.82,roughness:.2});
const coolGlowMat=new THREE.MeshStandardMaterial({color:'#e9fbff',emissive:'#b8eaff',emissiveIntensity:1.35});
const freezeGlowMat=new THREE.MeshStandardMaterial({color:'#eaf7ff',emissive:'#9bd4ff',emissiveIntensity:1.55});

function coolerHeaderTexture(label, frozen=false){
  const c=document.createElement('canvas');c.width=512;c.height=128;
  const g=c.getContext('2d');
  const grad=g.createLinearGradient(0,0,512,128);
  if(frozen){grad.addColorStop(0,'#b8d9ed');grad.addColorStop(1,'#e8f6ff');}
  else{grad.addColorStop(0,'#d8edf0');grad.addColorStop(1,'#f8f1df');}
  g.fillStyle=grad;g.fillRect(0,0,512,128);
  g.fillStyle=frozen?'#47758f':'#557d7b';g.font='bold 46px Arial';g.textAlign='center';g.textBaseline='middle';
  g.fillText(label,256,65);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const drinkHeaderMat=new THREE.MeshStandardMaterial({map:coolerHeaderTexture('DRINKS'),roughness:.42});
const frozenHeaderMat=new THREE.MeshStandardMaterial({map:coolerHeaderTexture('FROZEN',true),roughness:.42});
const coolerDoors=[];
const coolerUnits=[];

// Store interior is toward -X from this right-side wall. Doors hinge at their front edge.
const coolerX=9.95, unitW=2.12, unitD=1.48, unitH=4.55, unitBottom=.08;
const unitZs=[-6.05,-3.62,-1.19,1.24,3.67];
for(let i=0;i<5;i++){
  const frozen=i>=3, z=unitZs[i];
  const shell=frozen?freezerBodyMat:coolerBodyMat;
  const accent=frozen?freezeGlowMat:coolGlowMat;
  const unit=new THREE.Group();scene.add(unit);coolerUnits.push(unit);
  // Build the insulated cabinet as separate panels so the empty interior remains visible.
  const midY=unitBottom+unitH/2;
  const back=new THREE.Mesh(new THREE.BoxGeometry(.14,unitH,unitW),shell);
  back.position.set(coolerX+unitD/2-.07,midY,z);back.castShadow=true;unit.add(back);
  const topPanel=new THREE.Mesh(new THREE.BoxGeometry(unitD, .14, unitW),shell);
  topPanel.position.set(coolerX,unitBottom+unitH-.07,z);unit.add(topPanel);
  const bottomPanel=new THREE.Mesh(new THREE.BoxGeometry(unitD, .14, unitW),shell);
  bottomPanel.position.set(coolerX,unitBottom+.07,z);unit.add(bottomPanel);
  // Insulated side walls, with an open front for the transparent hinged door.
  for(const side of [-1,1]){
    const panel=new THREE.Mesh(new THREE.BoxGeometry(unitD,unitH,.14),coolerSideMat);
    panel.position.set(coolerX,midY,z+side*(unitW/2-.07));panel.castShadow=true;unit.add(panel);
  }
  // Dark rear liner and a cool-white interior back surface.
  const rearLiner=new THREE.Mesh(new THREE.BoxGeometry(.025,unitH-.34,unitW-.30),innerMat);
  rearLiner.position.set(coolerX+unitD/2-.15,midY,z);unit.add(rearLiner);
  // Front uprights and cross rails make the appliance look like a finished commercial unit.
  for(const side of [-1,1]){
    const upright=new THREE.Mesh(new THREE.BoxGeometry(.13,unitH-.10,.13),shell);
    upright.position.set(coolerX-unitD/2+.02,midY,z+side*(unitW/2-.065));unit.add(upright);
  }
  // Four empty display shelves with slim front lips.
  for(let s=0;s<4;s++){
    const y=unitBottom+.82+s*.78;
    const shelf=new THREE.Mesh(new THREE.BoxGeometry(unitD-.30,.045,unitW-.34),shelfMat);
    shelf.position.set(coolerX-.20,y,z);shelf.castShadow=true;unit.add(shelf);
    const lip=new THREE.Mesh(new THREE.BoxGeometry(.045,.10,unitW-.34),glassEdgeMat);
    lip.position.set(coolerX-.34,y+.055,z);unit.add(lip);
    for(const side of [-1,1]){
      const support=new THREE.Mesh(new THREE.BoxGeometry(unitD-.30,.035,.035),coolerDarkMat);
      support.position.set(coolerX-.20,y-.12,z+side*(unitW/2-.23));unit.add(support);
    }
  }
  // Interior vertical LED strips and soft cool illumination.
  for(const side of [-1,1]){
    const strip=new THREE.Mesh(new THREE.BoxGeometry(.045,unitH-.62,.045),accent);
    strip.position.set(coolerX-.69,unitBottom+unitH/2,z+side*(unitW/2-.16));unit.add(strip);
  }
  const interiorLight=new THREE.PointLight(frozen?0xc7e8ff:0xd9f4ff,frozen?2.0:1.8,4.2,2);
  interiorLight.position.set(coolerX-.72,2.55,z);unit.add(interiorLight);
  // Top sign panel, visible above the glass door.
  const header=new THREE.Mesh(new THREE.BoxGeometry(.13,.43,unitW-.10),frozen?frozenHeaderMat:drinkHeaderMat);
  header.position.set(coolerX-unitD/2-.015,unitBottom+unitH-.22,z);unit.add(header);
  // Bottom compressor grille with clean horizontal vents.
  const grille=new THREE.Mesh(new THREE.BoxGeometry(.12,.42,unitW-.12),coolerDarkMat);
  grille.position.set(coolerX-unitD/2-.025,unitBottom+.24,z);unit.add(grille);
  for(let k=0;k<7;k++){
    const vent=new THREE.Mesh(new THREE.BoxGeometry(.035,.025,unitW-.28),glassEdgeMat);
    vent.position.set(coolerX-unitD/2-.10,unitBottom+.10+k*.045,z);unit.add(vent);
  }
  // Glass door on a real hinge pivot: tap/click to swing open or closed.
  const frontX=coolerX-unitD/2-.105;
  const hingeZ=z-unitW/2+.075;
  const pivot=new THREE.Group();pivot.position.set(frontX,unitBottom+.48,hingeZ);scene.add(pivot);
  const doorH=unitH-.96, doorW=unitW-.15;
  const doorGlass=new THREE.Mesh(new THREE.BoxGeometry(.055,doorH,doorW),glassMat);
  doorGlass.position.set(-.018,doorH/2,doorW/2);doorGlass.userData.coolerDoor=pivot;pivot.add(doorGlass);
  // Metallic door perimeter frame.
  for(const side of [-1,1]){
    const stile=new THREE.Mesh(new THREE.BoxGeometry(.09,doorH,.075),glassEdgeMat);
    stile.position.set(-.055,doorH/2,doorW/2+side*(doorW/2-.035));stile.userData.coolerDoor=pivot;pivot.add(stile);
  }
  for(const ySide of [0,1]){
    const rail=new THREE.Mesh(new THREE.BoxGeometry(.09,.075,doorW),glassEdgeMat);
    rail.position.set(-.055,ySide?doorH-.035:.035,doorW/2);rail.userData.coolerDoor=pivot;pivot.add(rail);
  }
  // Long vertical handle on the free edge.
  const handle=new THREE.Mesh(new THREE.BoxGeometry(.10,.62,.075),handleMat);
  handle.position.set(-.11,doorH*.53,doorW-.10);handle.userData.coolerDoor=pivot;pivot.add(handle);
  const hinge=new THREE.Mesh(new THREE.BoxGeometry(.12,doorH-.12,.09),coolerDarkMat);
  hinge.position.set(.015,doorH/2,.055);pivot.add(hinge);
  pivot.userData.isOpen=false;pivot.userData.target=0;pivot.userData.kind=frozen?'freezer':'fridge';
  coolerDoors.push(pivot);
  // Small floor-level feet and side edge trim.
  for(const side of [-1,1]){
    const foot=new THREE.Mesh(new THREE.BoxGeometry(.48,.12,.18),coolerDarkMat);
    foot.position.set(coolerX+.36,unitBottom-.02,z+side*(unitW/2-.12));unit.add(foot);
  }
}

// Tap a glass door to open/close it. A short easing animation gives a hinged 3D swing.
const doorRaycaster=new THREE.Raycaster();
const doorPointer=new THREE.Vector2();
let pressX=0,pressY=0;
renderer.domElement.addEventListener('pointerdown',e=>{pressX=e.clientX;pressY=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-pressX,e.clientY-pressY)>7)return;
  const rect=renderer.domElement.getBoundingClientRect();
  doorPointer.x=((e.clientX-rect.left)/rect.width)*2-1;
  doorPointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  doorRaycaster.setFromCamera(doorPointer,camera);
  const hits=doorRaycaster.intersectObjects(coolerDoors,true);
  if(hits.length){
    let node=hits[0].object;
    while(node&&!node.userData.coolerDoor)node=node.parent;
    const pivot=node?.userData.coolerDoor;
    if(pivot){pivot.userData.isOpen=!pivot.userData.isOpen;pivot.userData.target=pivot.userData.isOpen?-1.18:0;}
  }
});


// V7.5 FRONT FASCIA SIGN — mounted on the CUSTOMER-FACING FRONT edge (+Z).
// The sign is deliberately above the open storefront, not on the rear roof.
const signWoodMat=new THREE.MeshStandardMaterial({color:'#a9754d',roughness:.72});
const signTrimMat=new THREE.MeshStandardMaterial({color:'#6f472f',roughness:.76});
const signMetalMat=new THREE.MeshStandardMaterial({color:'#292a29',metalness:.68,roughness:.3});
const signGlowMat=new THREE.MeshStandardMaterial({
  color:'#fff0ce',emissive:'#ffc66e',emissiveIntensity:2.2,roughness:.25
});

// Custom high-resolution timber sign face with the exact shop name.
const signCanvas=document.createElement('canvas');
signCanvas.width=2048;signCanvas.height=320;
const sg=signCanvas.getContext('2d');
const signGrad=sg.createLinearGradient(0,0,0,320);
signGrad.addColorStop(0,'#d6a879');signGrad.addColorStop(.48,'#bd895b');signGrad.addColorStop(1,'#a9754b');
sg.fillStyle=signGrad;sg.fillRect(0,0,2048,320);
// Fine natural timber grain.
let signSeed=4821;
const signRand=()=>{signSeed=(signSeed*9301+49297)%233280;return signSeed/233280;};
for(let i=0;i<115;i++){
  const y=signRand()*320,x=signRand()*2048,w=80+signRand()*560;
  sg.strokeStyle=i%3===0?'#f4d3a6':'#70482f';
  sg.globalAlpha=.10+signRand()*.12;sg.lineWidth=1+signRand()*3;
  sg.beginPath();sg.moveTo(x,y);sg.bezierCurveTo(x+w*.3,y-4,x+w*.7,y+4,x+w,y);sg.stroke();
}
sg.globalAlpha=1;
// Inner inset border.
sg.strokeStyle='#f0d0a7';sg.lineWidth=12;sg.strokeRect(22,22,2004,276);
sg.strokeStyle='#805435';sg.lineWidth=5;sg.strokeRect(37,37,1974,246);
// Shop name with a warm cream outline and dark raised-looking face.
sg.textAlign='center';sg.textBaseline='middle';
sg.font='900 184px "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
sg.lineJoin='round';sg.shadowColor='rgba(55,31,17,.48)';sg.shadowBlur=8;sg.shadowOffsetY=9;
sg.lineWidth=25;sg.strokeStyle='#fff0d9';sg.strokeText('乡间小杂货铺',1024,165);
sg.fillStyle='#60351f';sg.fillText('乡间小杂货铺',1024,165);
sg.shadowColor='transparent';sg.shadowBlur=0;sg.shadowOffsetY=0;
const signTexture=new THREE.CanvasTexture(signCanvas);
signTexture.colorSpace=THREE.SRGBColorSpace;
signTexture.anisotropy=8;
const signFaceMat=new THREE.MeshStandardMaterial({map:signTexture,roughness:.68});

// Wide fascia board sits just in front of the front roof beam, facing outward.
const signW=16.8, signH=2.55, signY=8.55, signZ=9.02;
addBox(signW+.34,signH+.30,.42,signTrimMat,0,signY,signZ);
const signFace=new THREE.Mesh(new THREE.PlaneGeometry(signW,signH),signFaceMat);
signFace.position.set(0,signY,signZ+.216);scene.add(signFace);
// Solid timber top/bottom caps and end posts create a readable 3D frame.
addBox(signW+.48,.16,.52,signWoodMat,0,signY+signH/2+.08,signZ);
addBox(signW+.48,.16,.52,signWoodMat,0,signY-signH/2-.08,signZ);
for(const x of [-signW/2-.12,signW/2+.12]){
  addBox(.18,signH+.30,.54,signWoodMat,x,signY,signZ);
  // Decorative round metal fixing bolts.
  for(const y of [signY-signH/2+.18,signY+signH/2-.18]){
    const bolt=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.035,16),signMetalMat);
    bolt.rotation.x=Math.PI/2;bolt.position.set(x,y,signZ+.29);scene.add(bolt);
  }
}
// Timber support brackets tie the sign back to the front roof lintel.
for(const x of [-6.9,0,6.9]){
  addBox(.16,.72,.18,beamMat,x,7.18,8.78);
  const brace=new THREE.Mesh(new THREE.BoxGeometry(.16,.78,.18),beamMat);
  brace.position.set(x,7.62,8.78);brace.rotation.z=x===0?0:(x<0?-.45:.45);scene.add(brace);
}
// Three black gooseneck lamps above the sign, aimed down at its lettering.
for(const x of [-5.7,0,5.7]){
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.32,12),signMetalMat);
  stem.position.set(x,9.99,signZ-.03);scene.add(stem);
  const armCurve=new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(x,10.12,signZ-.03),
    new THREE.Vector3(x,10.42,signZ+.02),
    new THREE.Vector3(x,10.32,signZ+.24)
  );
  const arm=new THREE.Mesh(new THREE.TubeGeometry(armCurve,16,.045,8,false),signMetalMat);
  scene.add(arm);
  const shade=new THREE.Mesh(new THREE.CylinderGeometry(.17,.25,.22,20),signMetalMat);
  shade.position.set(x,10.22,signZ+.27);shade.rotation.x=Math.PI;scene.add(shade);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(.105,16,12),signGlowMat);
  bulb.position.set(x,10.08,signZ+.27);scene.add(bulb);
  const lampLight=new THREE.PointLight(0xffcf86,8,5,2);
  lampLight.position.set(x,10.0,signZ+.52);scene.add(lampLight);
}
// Small greenery and white blossoms at both ends, kept clear of the sign text.
const signLeafMat=new THREE.MeshStandardMaterial({color:'#527d45',roughness:.8});
const signFlowerMat=new THREE.MeshStandardMaterial({color:'#fff5df',roughness:.65});
const signCenterMat=new THREE.MeshStandardMaterial({color:'#e5b85e',roughness:.7});
for(const side of [-1,1]){
  const bx=side*7.55;
  for(let i=0;i<5;i++){
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),signLeafMat);
    leaf.scale.set(.55,1.65,.48);
    leaf.position.set(bx+side*(i%2)*.16,signY-.48+(i%3)*.16,signZ+.29);
    leaf.rotation.z=side*(.35+i*.12);scene.add(leaf);
  }
  for(let i=0;i<3;i++){
    const fx=bx-side*.28+(i-1)*.18, fy=signY-.48+(i%2)*.15;
    const flower=new THREE.Group();flower.position.set(fx,fy,signZ+.34);scene.add(flower);
    for(let p=0;p<5;p++){
      const a=p*Math.PI*2/5;
      const petal=new THREE.Mesh(new THREE.SphereGeometry(.075,10,8),signFlowerMat);
      petal.position.set(Math.cos(a)*.09,Math.sin(a)*.09,0);flower.add(petal);
    }
    const center=new THREE.Mesh(new THREE.SphereGeometry(.045,10,8),signCenterMat);
    flower.add(center);
  }
}

// Subtle natural daylight from the open front; no props, fixtures or furniture.
const ambientPlane=new THREE.Mesh(
  new THREE.PlaneGeometry(30,18),
  new THREE.MeshBasicMaterial({color:'#d8e7e3',transparent:true,opacity:.12,side:THREE.DoubleSide})
);
ambientPlane.rotation.x=-Math.PI/2;ambientPlane.position.y=-.005;scene.add(ambientPlane);

let dragging=false,lastX=0,lastY=0,azimuth=.63,elevation=.48,distance=29;
function updateCamera(){
  const target=new THREE.Vector3(0,2.6,-.5);
  camera.position.set(
    target.x+Math.sin(azimuth)*Math.cos(elevation)*distance,
    target.y+Math.sin(elevation)*distance,
    target.z+Math.cos(azimuth)*Math.cos(elevation)*distance
  );
  camera.lookAt(target);
}
updateCamera();
renderer.domElement.addEventListener('pointerdown',e=>{
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  azimuth-= (e.clientX-lastX)*.004;
  elevation=Math.max(.18,Math.min(.95,elevation+(e.clientY-lastY)*.003));
  lastX=e.clientX;lastY=e.clientY;updateCamera();
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{
  distance=Math.max(20,Math.min(42,distance+e.deltaY*.018));updateCamera();
},{passive:true});

function animate(){
  requestAnimationFrame(animate);
  for(const door of coolerDoors){
    const target=door.userData.target||0;
    door.rotation.y+=(target-door.rotation.y)*.16;
    if(Math.abs(target-door.rotation.y)<.001)door.rotation.y=target;
  }
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?48:42;
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
</script>
</body></html>
